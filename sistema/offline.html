<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sem conexão — Opa Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--surface:#141414;--border:#2a2a2a;--accent:#78be20;--text:#e8eaf0;--muted:#585858}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:2rem;text-align:center}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 30%,rgba(120,190,32,.05) 0%,transparent 70%);
  pointer-events:none}
.grid{position:fixed;inset:0;
  background-image:linear-gradient(#2a2a2a 1px,transparent 1px),
    linear-gradient(90deg,#2a2a2a 1px,transparent 1px);
  background-size:48px 48px;opacity:.3;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:3rem 2.5rem;max-width:440px;width:100%;position:relative;z-index:1;
  animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px;color:var(--accent);margin-bottom:2rem}
.icon{font-size:3.5rem;margin-bottom:1.5rem;display:block;animation:pulse 3s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;margin-bottom:.75rem}
p{font-size:.9rem;color:var(--muted);line-height:1.7;margin-bottom:2rem}
.status{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;
  padding:10px 16px;margin-bottom:1.5rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;
  border:none;background:var(--accent);color:#0d0d0d;transition:all .15s}
.btn:hover{background:#d4e83e;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:.75rem}
.btn-ghost:hover{background:#1e1e1e;color:var(--text)}
.actions{display:flex;flex-direction:column;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="grid"></div>
<div class="card">
  <div class="logo">◈ OPA STUDIO</div>
  <span class="icon">📡</span>
  <h1>Sem Conexão</h1>
  <p>Você está offline. Verifique sua conexão com a internet e tente novamente.</p>
  <div class="status" id="status">Verificando conexão...</div>
  <div class="actions">
    <button class="btn" onclick="tentar()">↺ Tentar novamente</button>
    <button class="btn btn-ghost" onclick="history.back()">← Voltar</button>
  </div>
</div>

<script>
function atualizarStatus(){
  const el=document.getElementById('status');
  if(navigator.onLine){
    el.textContent='✓ Conexão detectada — recarregando...';
    el.style.color='#4ade80';
    setTimeout(()=>location.reload(),800);
  } else {
    el.textContent='✗ Sem internet. Aguardando conexão...';
    el.style.color='#f87171';
  }
}

function tentar(){
  atualizarStatus();
  if(navigator.onLine) location.reload();
}

window.addEventListener('online', ()=>{ atualizarStatus(); });
window.addEventListener('offline',()=>{ atualizarStatus(); });
atualizarStatus();
</script>
</body>
</html>
